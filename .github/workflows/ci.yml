name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      # check-asset-sync.mjs compares src/assets/setup-* against the sibling
      # ../shop-os-installer/scripts/. Without the sibling it warns and passes,
      # which made this guard a no-op in CI. Clone it (public repo) so the guard
      # is real and a stale mirror fails the build instead of the deploy.
      - name: Fetch sibling installer repo
        run: git clone --depth 1 https://github.com/blueprintit-ai/shop-os-installer.git ../shop-os-installer
      - name: Asset sync guard
        run: node scripts/check-asset-sync.mjs

  # Merging to main IS the deploy. Runs only after tests and the sync guard
  # pass, only on pushes to main (never on PRs), one at a time.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-license-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions (token needs the 'Edit Cloudflare Workers' template), then re-run this job."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 15d971c799075806e4375219abc83936
      - name: Verify the live Worker serves the install scripts
        run: |
          set -e
          base=https://shop-os-license-server.glenn-15d.workers.dev
          curl -fsS "$base/setup-windows.ps1" | grep -q "Invoke-ShopOSInstall"
          curl -fsS "$base/setup-macos.sh" | grep -q "send_install_log"
          echo "live scripts OK"
